<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng nhập - LAN Guard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{min-height:100vh;background:linear-gradient(135deg,#081225,#1677ff);display:flex;align-items:center;justify-content:center}
.box{width:420px;background:white;padding:35px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
h1{text-align:center;margin-bottom:10px}
p{text-align:center;color:#666;margin-bottom:25px}
input{width:100%;padding:14px;margin-bottom:15px;border:1px solid #ddd;border-radius:10px}
button{width:100%;padding:14px;background:#1677ff;color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
.error{background:#fee2e2;color:#dc2626;padding:12px;border-radius:10px;margin-bottom:15px;text-align:center}
.demo{margin-top:15px;background:#f3f6fb;padding:12px;border-radius:10px;color:#555}
</style>
</head>
<body>
<div class="box">
<h1>LAN Guard</h1>
<p>Enterprise Network Monitoring</p>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="POST">
<input name="u" placeholder="Username" required>
<input name="p" type="password" placeholder="Password" required>
<button type="submit">Đăng nhập</button>
</form>

<div class="demo">
<b>Demo:</b><br>
Username: admin<br>
Password: 123
</div>
</div>
</body>
</html>
