<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Nhật ký hoạt động</title>
<style>
body{font-family:Arial;background:#f3f6fb;padding:30px}
a{display:inline-block;margin-bottom:20px}
table{width:100%;border-collapse:collapse;background:white}
th{background:#081225;color:white;padding:14px}
td{padding:14px;border:1px solid #eee}
</style>
</head>
<body>
<h1>Nhật ký hoạt động</h1>
<a href="/">Quay lại Dashboard</a>

<table>
<tr><th>Thời gian</th><th>Loại sự kiện</th><th>Mô tả</th></tr>
{% for r in rows %}
<tr>
<td>{{ r.event_time }}</td>
<td>{{ r.event_type }}</td>
<td>{{ r.description }}</td>
</tr>
{% endfor %}
</table>
</body>
</html>
